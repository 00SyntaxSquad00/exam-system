<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart English Assessment</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>

        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        .english-bg {

            background:
                linear-gradient(
                    rgba(8, 15, 35, 0.88),
                    rgba(32, 12, 60, 0.92)
                ),
                url("https://images.unsplash.com/photo-1456513080510-7bf3a84b82f8?auto=format&fit=crop&w=2000&q=85");

            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .glass {

            background: rgba(255,255,255,0.08);

            backdrop-filter: blur(18px);

            -webkit-backdrop-filter: blur(18px);
        }

        textarea,
        input {
            outline: none;
        }

    </style>

</head>


<body class="english-bg min-h-screen p-4 flex flex-col items-center text-white">


<div class="max-w-4xl w-full">


    <!-- HEADER -->

    <div class="glass border border-white/20 rounded-3xl p-6 shadow-2xl mb-5">

        <div class="flex flex-col md:flex-row justify-between gap-5 items-center">

            <div>

                <div class="flex items-center gap-3 mb-2">

                    <div
                        class="w-12 h-12 rounded-xl bg-purple-600 flex items-center justify-center font-black text-xl">
                        A+
                    </div>

                    <div>

                        <h1
                            id="exam-heading"
                            class="text-2xl font-black">
                            Smart English Assessment
                        </h1>

                        <p
                            id="student-info"
                            class="text-sm text-gray-300 mt-1">
                        </p>

                    </div>

                </div>

                <div class="flex gap-2 text-xs mt-3">

                    <span class="bg-purple-500/20 border border-purple-400/30 px-3 py-1 rounded-full">
                        IGCSE
                    </span>

                    <span class="bg-blue-500/20 border border-blue-400/30 px-3 py-1 rounded-full">
                        English
                    </span>

                    <span class="bg-green-500/20 border border-green-400/30 px-3 py-1 rounded-full">
                        AI Grading
                    </span>

                </div>

            </div>


            <div
                id="timer-box"
                class="bg-red-600/20 border border-red-500/50 px-6 py-3 rounded-2xl text-center min-w-[130px]">

                <span
                    class="text-xs text-red-300 block">
                    Time Remaining
                </span>

                <span
                    id="time-left"
                    class="font-black text-2xl">
                    10:00
                </span>

            </div>

        </div>

    </div>


    <!-- EXAM CONTAINER -->

    <div
        id="exam-container"
        class="glass border border-white/20 rounded-3xl p-6 shadow-2xl">

        <div class="text-center py-10 text-gray-300">
            Loading exam...
        </div>

    </div>


</div>


<script type="module">

import {
    db,
    doc,
    setDoc,
    getDoc
} from "./firebase.js";


/* =========================================================
   GLOBAL VARIABLES
========================================================= */

let examSettings = {
    duration: 10,
    status: "Open"
};

let questions = [];

let submissions = {};

let studentID =
    localStorage.getItem("currentStudentID");

let studentName =
    localStorage.getItem("currentStudentName");

let timerInterval = null;

let examSubmissionStarted = false;


/* =========================================================
   LOGIN CHECK
========================================================= */

if (!studentID) {

    window.location.href = "index.html";

}


/* =========================================================
   AI HELPERS
========================================================= */

function addAIFile(content, data, label) {

    if (!data) return;

    if (data.startsWith("data:application/pdf")) {

        content.push({

            type: "input_file",

            file_data: data,

            filename:
                (label || "file") + ".pdf"
        });

    } else if (data.startsWith("data:image/")) {

        content.push({

            type: "input_image",

            image_url: data,

            detail: "high"
        });
    }
}


function getAIText(data) {

    if (data.output_text) {

        return data.output_text;
    }


    for (const item of data.output || []) {

        for (const part of item.content || []) {

            if (
                part.type === "output_text" &&
                part.text
            ) {

                return part.text;
            }
        }
    }

    return "";
}


async function callAI(content, apiKey) {

    const response =
        await fetch(
            "https://api.openai.com/v1/responses",
            {

                method: "POST",

                headers: {

                    "Content-Type":
                        "application/json",

                    "Authorization":
                        "Bearer " + apiKey
                },

                body: JSON.stringify({

                    model: "gpt-4o",

                    input: [
                        {
                            role: "user",
                            content
                        }
                    ],

                    text: {

                        format: {

                            type: "json_schema",

                            name: "exam_grading",

                            strict: true,

                            schema: {

                                type: "object",

                                properties: {

                                    studentTranscription: {
                                        type: "string"
                                    },

                                    awardedPoints: {
                                        type: "number"
                                    },

                                    feedback: {
                                        type: "string"
                                    }
                                },

                                required: [
                                    "studentTranscription",
                                    "awardedPoints",
                                    "feedback"
                                ],

                                additionalProperties: false
                            }
                        }
                    },

                    max_output_tokens: 1200,

                    store: false
                })
            }
        );


    const data =
        await response.json();


    if (!response.ok) {

        throw new Error(
            data?.error?.message ||
            "OpenAI request failed."
        );
    }


    if (data?.incomplete_details) {

        throw new Error(
            "OpenAI response was incomplete."
        );
    }


    const text =
        getAIText(data).trim();


    if (!text) {

        throw new Error(
            "OpenAI returned no grading result."
        );
    }


    return text
        .replace(/```json/gi, "")
        .replace(/```/g, "")
        .trim();
}


/* =========================================================
   LOAD FIREBASE DATA
========================================================= */

async function loadExamData() {

    try {

        const settingsSnap =
            await getDoc(
                doc(db, "examData", "settings")
            );


        if (settingsSnap.exists()) {

            examSettings =
                settingsSnap.data().exam ||
                examSettings;
        }


        const questionsSnap =
            await getDoc(
                doc(db, "examData", "questionsBank")
            );


        if (questionsSnap.exists()) {

            questions =
                questionsSnap.data().list || [];
        }


        const submissionsSnap =
            await getDoc(
                doc(db, "examData", "submissions")
            );


        if (submissionsSnap.exists()) {

            submissions =
                submissionsSnap.data().list || {};
        }


        document.getElementById(
            "student-info"
        ).innerText =
            `Student: ${studentName} • ID: ${studentID}`;


        checkStudentSubmission();


    } catch (error) {

        console.error(error);

        showMessage(
            "Unable to load the exam. Please refresh the page."
        );
    }
}


/* =========================================================
   CHECK EXISTING SUBMISSION
========================================================= */

function checkStudentSubmission() {

    const sub =
        submissions[studentID];


    if (!sub) {

        renderExam();

        return;
    }


    if (
        sub.status === "grading" ||
        sub.status === "processing"
    ) {

        showGradingScreen();

        startSubmissionStatusWatcher();

        return;
    }


    if (
        sub.status === "graded" ||
        sub.status === "approved" ||
        sub.graded === true
    ) {

        showFinalResult(sub);

        return;
    }


    renderExam();
}


/* =========================================================
   RENDER EXAM
========================================================= */

function renderExam() {

    const container =
        document.getElementById(
            "exam-container"
        );


    if (
        examSettings.status !== "Open" &&
        examSettings.status !== "متاح للطلاب"
    ) {

        showMessage(
            "The exam is currently closed."
        );

        return;
    }


    if (!questions.length) {

        showMessage(
            "There are no questions available."
        );

        return;
    }


    container.innerHTML = "";


    const form =
        document.createElement("form");

    form.id = "submit-form";

    form.className =
        "space-y-6";


    form.addEventListener(
        "submit",
        submitExam
    );


    questions.forEach(
        (q, index) => {

            const card =
                document.createElement("div");

            card.className =
                "bg-black/25 border border-white/10 p-5 rounded-2xl space-y-4";


            const title =
                document.createElement("div");

            title.className =
                "font-bold text-purple-200 text-lg";

            title.innerText =
                `${index + 1}. ${q.text} (${q.points} pts)`;


            card.appendChild(title);


            /* QUESTION FILE */

            if (q.questionFileBase64) {

                if (
                    q.questionFileBase64
                    .startsWith("data:image/")
                ) {

                    const image =
                        document.createElement("img");

                    image.src =
                        q.questionFileBase64;

                    image.className =
                        "max-h-64 mx-auto rounded-xl border border-white/20";

                    card.appendChild(image);

                } else if (
                    q.questionFileBase64
                    .startsWith("data:application/pdf")
                ) {

                    const iframe =
                        document.createElement("iframe");

                    iframe.src =
                        q.questionFileBase64;

                    iframe.className =
                        "w-full h-96 rounded-xl border border-white/20";

                    card.appendChild(iframe);
                }
            }


            /* MCQ */

            if (
                q.type === "mcq" &&
                q.rawOptions &&
                q.rawOptions.length
            ) {

                const letters =
                    ["A", "B", "C", "D", "E"];


                q.rawOptions.forEach(
                    (option, optionIndex) => {

                        const label =
                            document.createElement("label");

                        label.className =
                            "flex items-center gap-3 bg-black/30 border border-white/10 p-3 rounded-xl cursor-pointer hover:bg-purple-900/30 transition";


                        const radio =
                            document.createElement("input");

                        radio.type =
                            "radio";

                        radio.name =
                            `q_${index}`;

                        radio.value =
                            `${letters[optionIndex]}) ${option}`;

                        radio.required =
                            true;

                        radio.className =
                            "w-4 h-4";


                        const text =
                            document.createElement("span");

                        text.innerText =
                            `${letters[optionIndex]}) ${option}`;


                        label.appendChild(radio);

                        label.appendChild(text);

                        card.appendChild(label);
                    }
                );

            } else {

                /* ESSAY */

                const textarea =
                    document.createElement("textarea");

                textarea.name =
                    `q_${index}`;

                textarea.rows =
                    5;

                textarea.className =
                    "w-full bg-black/40 border border-white/20 rounded-xl p-4 text-white resize-none";

                textarea.placeholder =
                    "Write your answer here...";


                card.appendChild(textarea);
            }


            /* FILE UPLOAD */

            const uploadBox =
                document.createElement("div");

            uploadBox.className =
                "border-t border-white/10 pt-4";


            const uploadLabel =
                document.createElement("p");

            uploadLabel.className =
                "text-xs text-gray-400 mb-2";

            uploadLabel.innerText =
                "Optional: Upload a handwritten answer image or PDF";


            const fileInput =
                document.createElement("input");

            fileInput.type =
                "file";

            fileInput.id =
                `file_${index}`;

            fileInput.accept =
                "image/png,image/jpeg,image/webp,.pdf";

            fileInput.className =
                "text-xs text-gray-400 file:bg-purple-600 file:text-white file:border-0 file:px-4 file:py-2 file:rounded-lg";


            uploadBox.appendChild(
                uploadLabel
            );

            uploadBox.appendChild(
                fileInput
            );

            card.appendChild(
                uploadBox
            );


            form.appendChild(card);
        }
    );


    /* SUBMIT BUTTON */

    const submitButton =
        document.createElement("button");

    submitButton.type =
        "submit";

    submitButton.id =
        "submit-button";

    submitButton.className =
        "w-full bg-green-600 hover:bg-green-500 py-4 rounded-2xl font-black text-lg transition shadow-lg";

    submitButton.innerText =
        "Submit Exam";


    form.appendChild(
        submitButton
    );


    container.appendChild(form);


    startTimer();
}


/* =========================================================
   SUBMIT EXAM
========================================================= */

async function submitExam(event) {

    event.preventDefault();

    await finalizeExam("manual");
}


/* =========================================================
   FINALIZE EXAM
========================================================= */

async function finalizeExam(reason) {

    if (examSubmissionStarted) {

        return;
    }


    examSubmissionStarted = true;


    /* STOP TIMER IMMEDIATELY */

    stopTimer();


    const submitButton =
        document.getElementById(
            "submit-button"
        );

    if (submitButton) {

        submitButton.disabled =
            true;

        submitButton.innerText =
            "Submitting...";
    }


    let studentAnswers = {};


    for (
        let index = 0;
        index < questions.length;
        index++
    ) {

        const q =
            questions[index];


        let answer = "";


        if (q.type === "mcq") {

            const selected =
                document.querySelector(
                    `input[name="q_${index}"]:checked`
                );

            answer =
                selected
                    ? selected.value
                    : "";

        } else {

            const textarea =
                document.querySelector(
                    `textarea[name="q_${index}"]`
                );

            answer =
                textarea
                    ? textarea.value
                    : "";
        }


        let image =
            null;


        const fileInput =
            document.getElementById(
                `file_${index}`
            );


        if (
            fileInput &&
            fileInput.files &&
            fileInput.files[0]
        ) {

            const file =
                fileInput.files[0];


            const allowedTypes = [

                "image/png",
                "image/jpeg",
                "image/webp",
                "application/pdf"

            ];


            if (
                !allowedTypes.includes(
                    file.type
                )
            ) {

                alert(
                    "Unsupported file type. Please use JPG, PNG, WEBP or PDF."
                );

                examSubmissionStarted =
                    false;

                startTimer();

                return;
            }


            image =
                await readFileAsDataURL(
                    file
                );
        }


        studentAnswers[index] = {

            answer,

            image,

            aiAwardedPoints: 0,

            aiEvaluation: "",

            aiTranscription: ""
        };
    }


    /*
       IMPORTANT:
       SAVE THE SUBMISSION BEFORE AI GRADING.
       THIS PREVENTS REFRESH FROM REOPENING THE EXAM.
    */

    submissions[studentID] = {

        studentId:
            studentID,

        studentName:
            studentName,

        answers:
            studentAnswers,

        autoScore:
            0,

        finalScore:
            0,

        status:
            "grading",

        graded:
            false,

        submissionReason:
            reason,

        submittedAt:
            new Date().toISOString(),

        teacherNotes:
            "AI grading in progress."
    };


    try {

        await setDoc(
            doc(
                db,
                "examData",
                "submissions"
            ),
            {
                list:
                    submissions
            }
        );

    } catch (error) {

        console.error(error);

        examSubmissionStarted =
            false;

        alert(
            "Your submission could not be saved. Please try again."
        );

        startTimer();

        return;
    }


    /* SHOW GRADING SCREEN */

    showGradingScreen();


    /*
       START AI GRADING
    */

    const apiKey =
        localStorage.getItem(
            "openaiApiKey"
        ) || "";


    await processGrading(
        studentAnswers,
        apiKey
    );
}


/* =========================================================
   AI GRADING
========================================================= */

async function processGrading(
    answersObj,
    openaiApiKey
) {

    let totalScore = 0;


    for (
        let qIdx = 0;
        qIdx < questions.length;
        qIdx++
    ) {

        const q =
            questions[qIdx];

        const ansObj =
            answersObj[qIdx];


        if (q.type === "mcq") {

            const studentAnswer =
                (ansObj?.answer || "")
                    .trim()
                    .charAt(0)
                    .toUpperCase();


            const modelAnswer =
                (q.modelAnswer || "")
                    .trim()
                    .charAt(0)
                    .toUpperCase();


            if (
                studentAnswer &&
                modelAnswer &&
                studentAnswer === modelAnswer
            ) {

                ansObj.aiAwardedPoints =
                    q.points || 0;

                ansObj.aiEvaluation =
                    "Correct answer.";

                totalScore +=
                    q.points || 0;

            } else {

                ansObj.aiAwardedPoints =
                    0;

                ansObj.aiEvaluation =
                    "Incorrect answer.";
            }


            continue;
        }


        /* ESSAY */

        const typedAnswer =
            (ansObj?.answer || "")
                .trim();


        if (
            !ansObj?.image &&
            !typedAnswer
        ) {

            ansObj.aiAwardedPoints =
                0;

            ansObj.aiEvaluation =
                "No answer was provided.";

            continue;
        }


        if (!openaiApiKey) {

            ansObj.aiAwardedPoints =
                0;

            ansObj.aiEvaluation =
                "AI grading could not be completed because the OpenAI API key is missing.";

            continue;
        }


        const prompt = `You are an expert English examination grader.

This is an English exam for an IGCSE-level student.

Read the student's answer carefully.

If a student answer image or PDF is attached, it is the PRIMARY SOURCE for grading.

You MUST inspect the actual uploaded answer.

Read handwriting carefully.

Compare the student's answer with the instructor's model answer or hint.

Question:
${q.text}

Instructor Model Answer / Hint:
${q.essayHintText || "Use the attached instructor answer file if available."}

Student Typed Answer:
${typedAnswer || "No typed answer. The student's answer may be in the uploaded image."}

Maximum Points:
${q.points || 0}

GRADING RULES:

1. Grade based on correctness and understanding.
2. Do not require exact wording.
3. Give partial credit when appropriate.
4. Check important concepts, reasoning, grammar-related requirements, calculations and conclusions when relevant.
5. Do not give points simply because the student wrote something.
6. Do not give full marks unless the answer satisfies the requirements.
7. If the answer is missing or meaningless, give 0.
8. Explain what was correct.
9. Explain what was incorrect or missing.
10. The awardedPoints must be between 0 and the maximum points.

Return ONLY valid JSON:

{
  "studentTranscription": "",
  "awardedPoints": 0,
  "feedback": ""
}`;


        const content = [

            {
                type:
                    "input_text",

                text:
                    prompt
            }

        ];


        addAIFile(
            content,
            q.questionFileBase64,
            "question"
        );


        addAIFile(
            content,
            q.hintFileBase64,
            "instructor-hint"
        );


        if (ansObj?.image) {

            content.push({

                type:
                    "input_text",

                text:
                    "IMPORTANT: The following attachment is the student's actual answer. Inspect it carefully before grading."
            });


            if (
                ansObj.image
                    .startsWith(
                        "data:image/"
                    )
            ) {

                content.push({

                    type:
                        "input_image",

                    image_url:
                        ansObj.image,

                    detail:
                        "high"
                });

            } else {

                content.push({

                    type:
                        "input_file",

                    file_data:
                        ansObj.image,

                    filename:
                        "student-answer.pdf"
                });
            }
        }


        try {

            const result =
                await callAI(
                    content,
                    openaiApiKey
                );


            const aiResult =
                JSON.parse(result);


            let awarded =
                Number(
                    aiResult.awardedPoints
                );


            if (
                !Number.isFinite(
                    awarded
                )
            ) {

                awarded = 0;
            }


            awarded =
                Math.max(
                    0,
                    Math.min(
                        q.points || 0,
                        awarded
                    )
                );


            ansObj.aiAwardedPoints =
                awarded;


            ansObj.aiTranscription =
                aiResult.studentTranscription ||
                "";


            ansObj.aiEvaluation =
                aiResult.feedback ||
                "AI grading completed.";


            totalScore +=
                awarded;


        } catch (error) {

            console.error(
                "AI grading error:",
                error
            );


            ansObj.aiAwardedPoints =
                0;


            ansObj.aiEvaluation =
                "AI grading error: " +
                error.message;
        }
    }


    /* FINAL SAVE */

    submissions[studentID] = {

        ...submissions[studentID],

        answers:
            answersObj,

        autoScore:
            totalScore,

        finalScore:
            totalScore,

        status:
            "graded",

        graded:
            true,

        gradedAt:
            new Date().toISOString(),

        teacherNotes:
            "Exam graded automatically by AI."
    };


    try {

        await setDoc(
            doc(
                db,
                "examData",
                "submissions"
            ),
            {
                list:
                    submissions
            }
        );


        showFinalResult(
            submissions[studentID]
        );


    } catch (error) {

        console.error(error);

        showMessage(
            "Your exam was graded, but the final result could not be saved. Please contact the administrator."
        );
    }
}


/* =========================================================
   SHOW GRADING SCREEN
========================================================= */

function showGradingScreen() {

    stopTimer();


    const container =
        document.getElementById(
            "exam-container"
        );


    container.innerHTML = `

        <div class="text-center py-16">

            <div
                class="w-20 h-20 mx-auto mb-6 rounded-full border-4 border-purple-500/30 border-t-purple-500 animate-spin">
            </div>

            <h2 class="text-2xl font-black text-purple-300">
                Your exam is being graded
            </h2>

            <p class="text-gray-300 mt-3">
                AI is currently analyzing your answers.
            </p>

            <p class="text-gray-400 text-sm mt-2">
                Please do not close the page.
            </p>

            <div
                class="mt-6 bg-black/30 border border-white/10 rounded-xl p-4 text-sm text-gray-400">
                Your exam has already been submitted successfully.
                Refreshing this page will NOT reopen the exam.
            </div>

        </div>
    `;


    startSubmissionStatusWatcher();
}


/* =========================================================
   WATCH GRADING STATUS
========================================================= */

function startSubmissionStatusWatcher() {

    if (
        window.gradingWatcher
    ) {

        clearInterval(
            window.gradingWatcher
        );
    }


    window.gradingWatcher =
        setInterval(
            async () => {

                try {

                    const snap =
                        await getDoc(
                            doc(
                                db,
                                "examData",
                                "submissions"
                            )
                        );


                    if (!snap.exists()) {
                        return;
                    }


                    const all =
                        snap.data().list || {};


                    const sub =
                        all[studentID];


                    if (!sub) {
                        return;
                    }


                    if (
                        sub.status === "graded" ||
                        sub.status === "approved" ||
                        sub.graded === true
                    ) {

                        clearInterval(
                            window.gradingWatcher
                        );


                        submissions =
                            all;


                        showFinalResult(
                            sub
                        );
                    }

                } catch (error) {

                    console.error(
                        "Status watcher error:",
                        error
                    );
                }

            },

            1500
        );
}


/* =========================================================
   FINAL RESULT
========================================================= */

function showFinalResult(sub) {

    stopTimer();


    const container =
        document.getElementById(
            "exam-container"
        );


    const totalPoints =
        questions.reduce(
            (sum, q) =>
                sum + Number(q.points || 0),
            0
        );


    const score =
        Number(
            sub.finalScore || 0
        );


    let percentage =
        totalPoints > 0
            ? Math.round(
                (score / totalPoints) * 100
            )
            : 0;


    let html = `

        <div class="text-center">

            <div

/* =========================================================
   TIMER
========================================================= */

function startTimer() {

    stopTimer();


    let totalSeconds =
        Number(
            examSettings.duration || 10
        ) * 60;


    updateTimerDisplay(
        totalSeconds
    );


    timerInterval =
        setInterval(
            async () => {

                if (
                    examSubmissionStarted
                ) {

                    stopTimer();

                    return;
                }


                totalSeconds--;


                updateTimerDisplay(
                    totalSeconds
                );


                if (
                    totalSeconds <= 0
                ) {

                    stopTimer();


                    await finalizeExam(
                        "time_expired"
                    );
                }

            },

            1000
        );
}


function stopTimer() {

    if (timerInterval) {

        clearInterval(
            timerInterval
        );

        timerInterval =
            null;
    }


    const timer =
        document.getElementById(
            "timer-box"
        );


    if (timer) {

        timer.classList.add(
            "opacity-50"
        );
    }
}


function updateTimerDisplay(
    seconds
) {

    const timer =
        document.getElementById(
            "time-left"
        );


    if (!timer) return;


    seconds =
        Math.max(
            0,
            seconds
        );


    const minutes =
        Math.floor(
            seconds / 60
        );


    const remaining =
        seconds % 60;


    timer.innerText =
        String(minutes).padStart(
            2,
            "0"
        )
        +
        ":"
        +
        String(remaining).padStart(
            2,
            "0"
        );
}


/* =========================================================
   HELPERS
========================================================= */

function readFileAsDataURL(file) {

    return new Promise(
        (resolve, reject) => {

            const reader =
                new FileReader();


            reader.onload =
                () =>
                    resolve(
                        reader.result
                    );


            reader.onerror =
                reject;


            reader.readAsDataURL(
                file
            );
        }
    );
}


function escapeHTML(value) {

    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );
}


function showMessage(message) {

    document.getElementById(
        "exam-container"
    ).innerHTML = `

        <div class="text-center py-16">

            <div class="text-5xl mb-5">
                📘
            </div>

            <h2 class="text-xl font-bold text-purple-300">
                ${escapeHTML(message)}
            </h2>

        </div>
    `;
}
